<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimal-ui">
<title>なつき あやめ｜Profile</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="なつきあやめのプロフィールページです。">
<meta property="og:title" content="なつき あやめ｜Profile">
<meta property="og:description" content="なつき あやめのプロフィールページです。">
<meta property="og:image" content="ogp.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Montserrat:wght@400;500;600&family=Noto+Sans+JP:wght@100;300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #efece7;
    --panel: #ffffff;
    --panel-soft: #f7f5f1;
    --ink: #2c2a27;
    --ink-soft: #6b665f;
    --line: #e3ded4;
    --accent-rose: #d99a95;
    --accent-blue: #a9c6cf;
    --accent-ink: #23211e;
    --radius-lg: 22px;
    --radius-md: 14px;
    --serif: "Noto Sans JP", "Hiragino Sans", sans-serif;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    --latin: "Montserrat", sans-serif;
    --jp-sans: "Noto Sans JP", "Hiragino Sans", sans-serif;
    --hover-line: #f0c419;
  }
  :root:not([data-theme="light"]) {
    /* keep light look even if a viewer prefers dark, per the reference site's own palette */
  }
  * { box-sizing: border-box; }
  html {
    background: var(--bg);
  }
  body {
    margin: 0;
    padding: 0;
    color: var(--ink);
    font-family: var(--serif);
    font-weight: 300;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
    position: relative;
  }
  .bg-decor {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-decor img {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 46vw;
    max-width: 560px;
    object-fit: cover;
    object-position: left center;
    opacity: 0.9;
    -webkit-mask-image: linear-gradient(to right, black 0%, black 20%, transparent 85%);
    mask-image: linear-gradient(to right, black 0%, black 20%, transparent 85%);
  }
  .page {
    width: 100%;
    max-width: 600px;
    position: relative;
    z-index: 1;
  }

  /* ---------- Header ---------- */
  .profile-head {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 8px 4px 20px;
  }
  .avatar {
    width: 92px;
    height: 92px;
    min-width: 92px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .head-text h1 {
    font-family: var(--serif);
    font-weight: 300;
    font-size: 26px;
    margin: 0 0 10px;
    letter-spacing: 0.02em;
  }
  .sns-row { display: flex; gap: 8px; }
  .sns-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent-ink);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    border: 2px solid transparent;
    transition: border-color 0.15s ease;
  }
  .sns-btn img {
    width: 60%;
    height: 60%;
    object-fit: contain;
    display: block;
  }
  .sns-btn:hover, .sns-btn:focus-visible {
    border-color: var(--hover-line);
  }

  /* ---------- Bio ---------- */
  .bio {
    padding: 4px 4px 24px;
    font-size: 15.5px;
    line-height: 1.9;
    color: var(--ink);
  }
  .bio p { margin: 0; }

  /* ---------- Feature banner ---------- */
  .feature {
    margin-bottom: 20px;
  }
  .feature-visual {
    position: relative;
  }
  .feature-visual .frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--accent-ink);
    box-sizing: border-box;
  }
  .feature-visual img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cta-btn {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent-ink);
    color: #fff;
    text-decoration: none;
    font-family: var(--jp-sans);
    font-size: 15px;
    font-weight: 500;
    padding: 13px 26px;
    border-radius: 999px;
    border: 2px solid transparent;
    transition: border-color 0.15s ease;
    white-space: nowrap;
  }
  .cta-btn:hover, .cta-btn:focus-visible {
    border-color: var(--hover-line);
  }
  .cta-btn svg { width: 14px; height: 14px; }

  /* ---------- Link cards ---------- */
  .card-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .link-card {
    background: var(--panel);
    border: 1px solid var(--accent-ink);
    border-radius: var(--radius-md);
    padding: 26px 10px 18px;
    text-align: center;
    text-decoration: none;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    transition: border-color 0.15s ease;
  }
  .link-card:hover, .link-card:focus-visible {
    border-color: var(--hover-line);
  }
  .link-card svg { width: 30px; height: 30px; color: var(--accent-blue); stroke: var(--accent-blue); }
  .link-card .title { font-family: var(--latin); font-weight: 600; font-size: 15px; }
  .link-card .sub { font-size: 12.5px; color: var(--ink-soft); }

  /* ---------- Support banner ---------- */
  .support {
    background: var(--panel);
    border: 1px solid var(--accent-ink);
    border-radius: var(--radius-md);
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.15s ease;
  }
  .support:hover, .support:focus-visible {
    border-color: var(--hover-line);
  }
  .support .wave { font-size: 26px; }
  .support-text { flex: 1; }
  .support-arrow { width: 16px; height: 16px; flex-shrink: 0; color: var(--ink-soft); }
  .support .title { font-family: var(--latin); font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .support .desc { font-size: 13.5px; color: var(--ink-soft); }

  footer {
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 28px;
  }

  @media (max-width: 400px) {
    .avatar { width: 76px; height: 76px; min-width: 76px; }
    .head-text h1 { font-size: 21px; }
  }
</style>
</head>
<body>
<div class="bg-decor">
  <img src="bg_u.jpg" alt="">
</div>

  <div class="bio">
    <p>左右非固定雑食の字書きです。たんぜんたんとかぜんねずを中心に書いていますが、基本的に雑食です。好きなキャラはすべからく上にも下にもしたいし女体化したいしケモにもしたい。<br>Xは基本作品投稿＆告知用であまりしゃべりません。<br>話しかけられるのはすきです！</p>

    <a class="link-card" href="https://privatter.me/user/ukkaribuncho">

      <div class="title">privatter</div>
      <div class="sub">未完・短編</div>

    <a class="link-card" href="https://privatter.net/m/ukkaribuncho">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="4" y="6" width="16" height="12" rx="1.5"></rect><path d="M4 7l8 6 8-6"></path></svg>
      <div class="title">message</div>
      <div class="sub">ご感想など</div>
    </a>
  </div>

  <a class="support" href="https://wavebox.me/wave/4rsyovdwbg6sw39d/">
    <div class="wave">👋</div>
    <div class="support-text">
      <div class="title">wave box</div>

    </div>
    <svg class="support-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
  </a>

  <footer>© ukkaribuncho</footer>

</div>

</body>
</html>
